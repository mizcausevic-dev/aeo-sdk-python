[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeo-protocol"
version = "0.2.0"
description = "Python SDK for the AEO Protocol v0.1 — parse, build, validate, and fetch AEO declaration documents."
readme = "README.md"
license = "MIT"
authors = [{ name = "Miz Causevic" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]
keywords = ["aeo", "answer-engine-optimization", "well-known", "llm", "json-ld"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/mizcausevic-dev/aeo-sdk-python"
Specification = "https://github.com/mizcausevic-dev/aeo-protocol-spec"
"Bug Tracker" = "https://github.com/mizcausevic-dev/aeo-sdk-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/aeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
